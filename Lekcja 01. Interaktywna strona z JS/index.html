<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktywna strona</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Moja interaktywna strona</h1>
    <div class="container">
        <div class="card">
            <h2>Licznik</h2>
            <p id="counter-display">0</p>
            <button onclick="addPoint()">+1</button>
            <button onclick="reset()">Reset</button>
        </div>
        <div class="card">
            <h2>Losowanie</h2>
            <p id="random-display">Kliknij i sprawdź!</p>
            <button onclick="draw()">Losuj!</button>
        </div>
        <div class="card">
            <h2>Widget</h2>
            <iframe src=https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2436.8835519906274!2d21.253341875633378!3d52.35439724847832!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x471edae94cac6f03%3A0x608a90ee93421659!2zV2_Fgm9taW4gU8WCb25lY3puYQ!5e0!3m2!1spl!2spl!4v1794508919762!5m2!1spl!2spl width="250" height="200"
            style="border:0; border-radius:8px;" loading="lazy">
        </iframe>
        </div>
    
    <div class="card">
        <h2>video</h2>
        <iframe src="https://myinstants.net/embed/?id=607a8889-77cd-4459-b5b3-79d1308a02f3&name=vine-boom-sound" width="200" height="96" style="border:0" loading="lazy" title="Vine Boom Sound sound button"></iframe>
<p style="margin:4px 0 0;font:13px sans-serif"><a href="https://myinstants.net/memesounds/607a8889-77cd-4459-b5b3-79d1308a02f3/vine-boom-sound/">Vine Boom Sound</a> on Myinstants.net</p>"></iframe>
</div>

</div class="card">

    <script src="script.js"></script>
</body>
</html>
